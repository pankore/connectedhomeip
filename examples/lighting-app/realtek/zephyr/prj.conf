# This sample uses sample-defaults.conf to set options common for all
# samples. This file should contain only options specific for this sample
# or overrides of default values.

# Realtek Bee 802.15.4 MAC driver backing the realtek,bee-ieee802154 node
# (dts/arm/realtek/bee/rtl87x2g.dtsi). IEEE802154_REALTEK_BEE is selected
# automatically once the node is enabled, so it is not set explicitly here.
CONFIG_REALTEK_BEE_EFUSE=y
CONFIG_REALTEK_BEE_MAC_802154=y

# Enable CHIP
CONFIG_CHIP=y
CONFIG_STD_CPP17=y

# Matter crypto backend. Must match chip_crypto = "psa" in
# config/realtek/chip-gn/args.gni, otherwise the PSA_WANT_* symbols the
# backend depends on are never selected. The generic choice defaults to
# CHIP_CRYPTO_MBEDTLS, so select PSA explicitly here (same as the NXP Zephyr
# samples). SPAKE2+ itself stays on mbedTLS.
CONFIG_CHIP_CRYPTO_PSA=y

# TEMP: disable the Bee PSA hardware accelerator to check whether it produces
# the same session keys as the software implementation. With it enabled the
# PASE session establishes but the first encrypted message fails to decrypt.
CONFIG_CRYPTO_BEE_PSA_ACCELERATOR=y

# CHIP configuration
CONFIG_CHIP_PROJECT_CONFIG="main/include/CHIPProjectConfig.h"

# 32773 == 0x8005 (example lighting-app)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32773

# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="RealtekLight"

# ---------------------------------------------------------------------------
# BLE: RAM footprint tuning
#
# This SoC has 176K of SRAM (tcm0: 0x100c00..0x12cc00) and the image already
# fills ~96% of it. The values below trim buffers that were sized for a
# generic multi-connection device; Matter only ever needs a single peripheral
# connection carrying BTP (BLE Transport Protocol) frames.
#
# Leaving these at their defaults adds roughly 6K of RAM and overflows the
# region.
#
# Do NOT reduce CONFIG_BT_L2CAP_TX_MTU / CONFIG_BT_BUF_ACL_RX_SIZE: BTP packs
# 244-byte ATT PDUs and a smaller MTU makes commissioning an order of
# magnitude slower.
# Do NOT disable CONFIG_BT_GATT_SERVICE_CHANGED: CONFIG_BT_GATT_DYNAMIC_DB
# depends on it, and Matter registers its GATT services at runtime.
# ---------------------------------------------------------------------------

# ATT/L2CAP/ACL TX buffers. Matter's BTP is a strict request-response channel,
# so only a couple of PDUs are ever in flight. att_pool alone accounts for
# ~2.5K (BT_ATT_TX_COUNT * BT_L2CAP_SDU_BUF_SIZE(247)).
# CONFIG_BT_ATT_TX_COUNT default follows BT_BUF_ACL_TX_COUNT; set explicitly.
# CONFIG_BT_ATT_TX_COUNT=2
# CONFIG_BT_BUF_ACL_TX_COUNT=4
# CONFIG_BT_L2CAP_TX_BUF_COUNT=4

# HCI event pool: the controller bursts several LE Meta events during PASE
# (connection complete, MTU exchange, PHY update...). 8 is the safe floor.
#CONFIG_BT_BUF_EVT_RX_COUNT=8

# Host thread stacks. The BLE RX path only hands frames to the CHIP task, so
# 1600 is far more than needed. HCI TX is derived from other symbols and only
# accepts an override with BT_HCI_TX_STACK_SIZE_WITH_PROMPT.
#CONFIG_BT_RX_STACK_SIZE=1600

# Realtek Bee HCI H2C pool: holds HCI commands plus ACL data handed to the
# controller. 1536 fits 6 full-size (251B) ACL packets.
#CONFIG_BT_BEE_HCI_H2C_POOL_SIZE=1536

# Matter has no use for these logs and their strings cost FLASH. The level is
# selected through a pair of choices (INHERIT vs an explicit seam), so the
# INHERIT option has to be turned off and one of the *_LOG_LEVEL_* options
# picked instead - the raw int symbol is not directly user-configurable.
# CONFIG_BT_KEYS_LOG_LEVEL_INHERIT=n
# CONFIG_BT_KEYS_LOG_LEVEL_ERR=y
# CONFIG_BT_RPA_LOG_LEVEL_INHERIT=n
# CONFIG_BT_RPA_LOG_LEVEL_ERR=y
# CONFIG_BT_SERVICE_LOG_LEVEL_INHERIT=n
# CONFIG_BT_SERVICE_LOG_LEVEL_ERR=y

# Enable Matter OTA DFU
# CONFIG_REALTEK_OTA=n
# CONFIG_CHIP_OTA_REQUESTOR=n
# CONFIG_CHIP_DEVICE_SOFTWARE_VERSION=1

# Enable CHIP pairing automatically on application start.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Disable CHIP shell support
CONFIG_SHELL=n
CONFIG_CHIP_LIB_SHELL=n
CONFIG_OPENTHREAD_SHELL=n

# Disable CHIP NFC for commissioning
CONFIG_CHIP_NFC_COMMISSIONING=n

# Disable factory data support
CONFIG_CHIP_FACTORY_DATA=n
CONFIG_CHIP_FACTORY_DATA_BUILD=n
CONFIG_CHIP_FACTORY_DATA_MERGE_WITH_FIRMWARE=n
CONFIG_CHIP_CERTIFICATION_DECLARATION_STORAGE=n

#Enable PWM
CONFIG_PWM=n

# Enable Power Management
CONFIG_PM=n

CONFIG_MAIN_STACK_SIZE=8192

# Enable OpenThread features set
CONFIG_OPENTHREAD_THREAD_VERSION_1_3=y
CONFIG_OPENTHREAD_COAP=n
CONFIG_OPENTHREAD_COAPS=n
CONFIG_OPENTHREAD_COMMISSIONER=n
CONFIG_OPENTHREAD_DIAG=y
CONFIG_OPENTHREAD_DNS_CLIENT=y
CONFIG_OPENTHREAD_DHCP6_SERVER=y
CONFIG_OPENTHREAD_DHCP6_CLIENT=y
CONFIG_OPENTHREAD_ECDSA=y
CONFIG_OPENTHREAD_ENABLE_SERVICE=y
CONFIG_OPENTHREAD_EXTERNAL_HEAP=y
CONFIG_OPENTHREAD_IP6_FRAGM=y
CONFIG_OPENTHREAD_JAM_DETECTION=y
CONFIG_OPENTHREAD_JOINER=y
CONFIG_OPENTHREAD_MAC_FILTER=y
CONFIG_OPENTHREAD_NETDIAG_CLIENT=y
CONFIG_OPENTHREAD_RAW=y
CONFIG_OPENTHREAD_SLAAC=y
CONFIG_OPENTHREAD_SNTP_CLIENT=y
CONFIG_OPENTHREAD_SRP_CLIENT=y
CONFIG_OPENTHREAD_UDP_FORWARD=y
CONFIG_OPENTHREAD_DUA=y
CONFIG_OPENTHREAD_MLR=y
CONFIG_OPENTHREAD_LINK_METRICS_INITIATOR=y
CONFIG_OPENTHREAD_LINK_METRICS_SUBJECT=y
CONFIG_OPENTHREAD_CSL_RECEIVER=y

# OpenThread message buffers. The default of 128 is sized for an FTD routing
# for many children; a Matter end device only talks to its single parent, so
# 64 is plenty. Each buffer is OPENTHREAD_MESSAGE_BUFFER_SIZE (128 B), so this
# saves 8K of the 176K SRAM.
CONFIG_OPENTHREAD_NUM_MESSAGE_BUFFERS=64

CONFIG_OPENTHREAD_DEBUG=y
CONFIG_OPENTHREAD_LOG_LEVEL_INFO=y
# CONFIG_OPENTHREAD_PING_SENDER=y

# Openthread L2
CONFIG_OPENTHREAD_RADIO_WORKQUEUE_STACK_SIZE=2048
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_NET_L2_OPENTHREAD=y

CONFIG_MBEDTLS_OPENTHREAD_OPTIMIZATIONS_ENABLED=n

# Generic networking options
CONFIG_NETWORKING=y
CONFIG_NET_PKT_TXTIME=y
CONFIG_NET_PKT_TIMESTAMP=y

CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CHIP_APP_LOG_LEVEL=3
# Synchronous logging: deferred mode buffers up to LOG_BUFFER_SIZE bytes, so the
# last lines before a hang never reach the UART. IMMEDIATE also frees the 4K log
# buffer, which this image needs (RAM was at 96%+ with deferred).
CONFIG_LOG_MODE_IMMEDIATE=y
# CONFIG_LOG_MODE_DEFERRED=y
# CONFIG_LOG_BUFFER_SIZE=4096